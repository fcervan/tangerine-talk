[project]
name = "tangerine-api"
version = "0.1.0"
description = "Backend do Tangerine Talk — tutor de idiomas com IA."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  # Teste de conexão e chamadas OpenAI-compatible aos provedores do usuário.
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncmy>=0.2.9,<1",
  # Necessário para o handshake caching_sha2_password do MySQL 8.
  "cryptography>=42,<50",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "pyjwt>=2.10,<3",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "aiosqlite>=0.20,<1",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
