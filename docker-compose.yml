name: tangerine-talk

services:
  mysql:
    image: mysql:8.4
    container_name: tangerine-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tangerine}
      MYSQL_USER: ${MYSQL_USER:-tangerine}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-troque-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-troque-me-tambem}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3310:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: ./api
    container_name: tangerine-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+asyncmy://tangerine:troque-me@mysql:3306/tangerine}
    ports:
      - "8010:8000"
    volumes:
      - api_storage:/app/data/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Front em container. Fora do perfil padrão para não conflitar com o
  # `npm run dev` local na porta 3000. Use: docker compose --profile web up -d
  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: web.Dockerfile
    container_name: tangerine-web
    restart: unless-stopped
    ports:
      - "3110:3000"
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:8000

  qdrant:
    image: qdrant/qdrant:v1.12
    container_name: tangerine-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:6333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tangerine-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mysql_data:
  api_storage:
  qdrant_storage:
  redis_data: